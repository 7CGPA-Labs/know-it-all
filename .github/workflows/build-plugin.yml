name: Build and Test Gedit Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-daemon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Build Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Vala & GTK Development Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libgtk-3-dev libpeas-dev libsoup-3.0-dev

      - name: Install Daemon Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Build Vala Plugin & Run Tests
        run: |
          make build-plugin
          PYTHONPATH=. python -m unittest service/tests/test_server.py

      - name: Build Docker Container
        run: |
          docker build -t gedit-research-daemon:ci service/

  package-plugin:
    runs-on: ubuntu-latest
    needs: test-daemon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vala & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libgtk-3-dev libpeas-dev libsoup-3.0-dev

      - name: Build Vala Plugin
        run: |
          make build-plugin

      - name: Package Plugin Archive
        run: |
          tar -czvf gedit-research-copilot.tar.gz -C plugin research_copilot.plugin libresearch_copilot.so

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gedit-research-copilot
          path: gedit-research-copilot.tar.gz
