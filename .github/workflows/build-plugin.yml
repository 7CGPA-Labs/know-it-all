name: Build and Test Gedit Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-daemon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Daemon Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Verify Service Compilation & Run Tests
        run: |
          python -m py_compile service/server.py service/download_model.py plugin/research_copilot.py
          PYTHONPATH=. python -m unittest service/tests/test_server.py

      - name: Build Docker Container
        run: |
          docker build -t gedit-research-daemon:ci service/

  package-plugin:
    runs-on: ubuntu-latest
    needs: test-daemon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Plugin Archive
        run: |
          tar -czvf gedit-research-copilot.tar.gz -C plugin research_copilot.plugin research_copilot.py

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gedit-research-copilot
          path: gedit-research-copilot.tar.gz
