name: Build Debian (.deb) Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libgtk-3-dev libpeas-dev libsoup-3.0-dev gcc make dpkg-dev curl

      - name: Build Debian Package
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowitall-debian-package
          path: knowitall.deb
