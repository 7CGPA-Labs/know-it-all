name: Publish ONNX Models

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-onnx-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Qwen 2.5 0.5B INT4 Quantized ONNX Model
        run: |
          chmod +x service/download_model.sh
          service/download_model.sh service/models/qwen2.5-0.5b-onnx

      - name: Compress Model Archive
        run: |
          tar -czvf qwen2.5-0.5b-onnx.tar.gz -C service/models qwen2.5-0.5b-onnx

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "v1.0.0 - Qwen 2.5 INT4 ONNX Models & Plugin Release"
          files: qwen2.5-0.5b-onnx.tar.gz
