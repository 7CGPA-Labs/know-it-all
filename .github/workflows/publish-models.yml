name: Publish ONNX Models

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-onnx-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Download Qwen 2.5 0.5B ONNX Model
        run: |
          python service/download_model.py --output service/models/qwen2.5-0.5b-onnx

      - name: Compress Model Archive
        run: |
          tar -czvf qwen2.5-0.5b-onnx.tar.gz -C service/models qwen2.5-0.5b-onnx

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "v1.0.0 - Qwen 2.5 ONNX Models & Plugin Release"
          files: qwen2.5-0.5b-onnx.tar.gz
